name: CI
on:
  push:
    branches: [master]
  pull_request:

env:
  REGISTRY: ghcr.io
  OWNER: pepis2317

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER}}/incentive-util:${{ github.sha }}
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER}}/incentive-util:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Push
        if: github.event_name == 'push'
        run: docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/incentive-util:${{ github.sha }}