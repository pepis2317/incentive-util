services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/incentive-util.db

  backup:
    build: .
    command: python backgrounder/backup.py
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/incentive-util.db
      - BACKUP_INTERVAL_SECONDS=21600
      - S3_KEY_ID=/run/secrets/s3_key_id
      - S3_SECRET=/run/secrets/s3_secret
    env_file:
      - .env
secrets:
  s3_key_id:
    file: ./secrets/s3_key_id
  s3_secret:
    file: ./secrets/s3_secret